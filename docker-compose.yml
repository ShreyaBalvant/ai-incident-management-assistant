version: '3.8'

services:
  incident-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_incident_assistant
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - LLM_PROVIDER_ORDER=${LLM_PROVIDER_ORDER:-groq,gemini}
      - DB_PATH=/app/data_volume/incidents.db
    volumes:
      # Persist SQLite incidents database across container restarts
      - sqlite_data:/app/data_volume
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sqlite_data:
    driver: local
